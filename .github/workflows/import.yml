name: Compiler Fonte Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Importer le ZIP si présent
        shell: bash
        run: |
          if [ -f Fonte-projet-android.zip ]; then
            unzip -q Fonte-projet-android.zip -d /tmp/fonte-import
            test -f /tmp/fonte-import/Fonte/settings.gradle.kts
            cp -a /tmp/fonte-import/Fonte/. .
            test -f app/build.gradle.kts
            rm -f Fonte-projet-android.zip .github/workflows/build.yml
            chmod +x gradlew
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Importer le code source Android Fonte"
            git push origin HEAD:main
          fi
      - name: Tests et compilation de l'APK
        shell: bash
        run: |
          test -f app/build.gradle.kts
          chmod +x gradlew
          ./gradlew test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fonte-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
