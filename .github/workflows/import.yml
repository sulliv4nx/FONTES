name: Importer Fonte Android et compiler l'APK
on:
  push:
    paths:
      - 'Fonte-projet-android.zip'
      - '.github/workflows/import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extraire le projet Android
        shell: bash
        run: |
          test -s Fonte-projet-android.zip
          unzip -q Fonte-projet-android.zip -d /tmp/fonte-import
          test -f /tmp/fonte-import/Fonte/settings.gradle.kts
          cp -a /tmp/fonte-import/Fonte/. .
          test -f app/build.gradle.kts
          chmod +x gradlew
          rm -f Fonte-projet-android.zip .github/workflows/import.yml
      - name: Enregistrer les fichiers du projet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importer le projet Android Fonte depuis l'archive"
          git push origin HEAD:main
      - name: Tests et compilation de l'APK
        shell: bash
        run: ./gradlew test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fonte-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
